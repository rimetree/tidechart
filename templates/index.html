<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New England Tide Charts</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f5f8fb;
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      label {
        display: block;
        margin: 14px 0 6px;
        font-weight: 600;
      }
      select, input[type="date"], input[type="search"], button {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #d3dce6;
        border-radius: 8px;
        font-size: 1rem;
        background: white;
      }
      button {
        cursor: pointer;
        background: #1161d1;
        color: white;
        border: 1px solid transparent;
        transition: background-color 120ms ease-in-out;
      }
      button:hover:not(:disabled) {
        background: #0f53b8;
      }
      button:disabled {
        background: #a4bcd9;
        cursor: not-allowed;
      }
      .form-row {
        display: grid;
        gap: 16px;
        align-items: end;
      }
      .form-row > div {
        min-width: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .row-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .row-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .row-3 > div > * {
        width: 100%;
      }
      @media (max-width: 720px) {
        .row-3 {
          grid-template-columns: 1fr;
        }
      }
      .station-section {
        margin-top: 24px;
      }
      .bg-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        pointer-events: none;
        opacity: 0;
        transition: opacity 150ms ease;
      }
      .station-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      .scrollable-grid {
        max-height: 360px;
        overflow-y: auto;
        padding-right: 6px;
      }
      details.station-section > summary {
        cursor: pointer;
        font-size: 1.1rem;
        font-weight: 600;
        color: #1a202c;
        padding: 4px 0;
      }
      details.station-section > summary::marker {
        color: #1161d1;
      }
      details.station-section[open] > summary {
        margin-bottom: 4px;
      }
      .station-card {
        position: relative;
        border: 1px solid #e3e8ef;
        border-radius: 14px;
        padding: 16px;
        background: #ffffff;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      }
      .station-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(18, 52, 85, 0.1);
      }
      .station-card.selected {
        border-color: #1161d1;
        box-shadow: 0 8px 22px rgba(17,97,209,0.16);
      }
      .station-card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }
      .station-card p {
        margin: 4px 0;
        color: #4a5568;
      }
      .station-card button {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px !important;
        height: 34px !important;
        max-width: 34px !important;
        min-width: 34px !important;
        padding: 0 !important;
        border-radius: 50%;
        border: 1px solid #d3dce6;
        background: white;
        color: #444;
        font-size: 18px;
        line-height: 1;
      }
      .station-card button.favorited {
        color: #d97706;
        border-color: #f6ad55;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .section-title h2 {
        margin: 0;
        font-size: 1.1rem;
      }
      .results {
        margin-top: 24px;
      }
      .summary-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      .summary-table th,
      .summary-table td {
        padding: 10px 12px;
        border: 1px solid #e3e8ef;
        text-align: left;
      }
      .summary-table th {
        background: #f0f4f9;
      }
      #chartContainer {
        margin-top: 24px;
        padding: 18px;
        border: 1px solid #e3e8ef;
        border-radius: 14px;
        background: #fbfdff;
      }
      #tideChart {
        width: 100%;
        height: 320px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      th, td {
        padding: 12px 10px;
        border-bottom: 1px solid #e3e8ef;
        text-align: left;
      }
      th {
        background: #f0f4f9;
      }
      .error {
        color: #b00020;
        margin-top: 16px;
      }
      .info {
        margin-top: 16px;
        color: #4a5568;
      }
      .small-note {
        margin-top: 8px;
        color: #718096;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div id="bgLayer" class="bg-layer"></div>
    <div class="container">
      <h1>New England Tide Charts</h1>
      <p>Search stations, flag favorites, and use the top New England stations for quick tide lookup.</p>

      <div class="form-row">
        <div>
          <label for="station">Selected station</label>
          <select id="station"></select>
        </div>
      </div>

      <div class="form-row row-3" style="margin-top: 8px;">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" />
        </div>
        <div>
          <label for="units">Units</label>
          <select id="units">
            <option value="metric">Metric (m)</option>
            <option value="english" selected>English (ft)</option>
          </select>
        </div>
        <div style="display:flex; flex-direction:column; justify-content:flex-end; gap:6px; min-width:0;">
          <span class="small-note" style="display:block;">Select a station or click a favorite card.</span>
          <button id="loadTides" style="width:100%;">Load Tides</button>
        </div>
      </div>

      <div class="station-section" id="favoritesSection"></div>

      <details class="station-section" id="allStationsDetails">
        <summary>Browse all stations</summary>
        <div class="form-row" style="margin-top: 16px;">
          <div>
            <label for="stationSearch">Search stations</label>
            <input type="search" id="stationSearch" placeholder="Search by name or state" />
          </div>
        </div>
        <div class="section-title" style="margin-top: 12px;">
          <span class="small-note" id="stationCountNote">Showing all matching stations.</span>
        </div>
        <div class="station-grid scrollable-grid" id="stationCards"></div>
      </details>

      <div class="results" id="results"></div>
      <div class="error" id="error"></div>
      <div class="info" id="info"></div>
    </div>

    <script>
      const stationSelect = document.getElementById('station');
      const stationSearch = document.getElementById('stationSearch');
      const favoritesSection = document.getElementById('favoritesSection');
      const stationCards = document.getElementById('stationCards');
      const bgLayer = document.getElementById('bgLayer');
      const dateInput = document.getElementById('date');
      const unitsSelect = document.getElementById('units');
      const loadButton = document.getElementById('loadTides');
      const resultsEl = document.getElementById('results');
      const errorEl = document.getElementById('error');
      const infoEl = document.getElementById('info');

      let allStations = {};
      let selectedStation = null;
      let favoriteStationIds = [];
      const defaultStationId = '8423898';
      const topStates = ['NH', 'ME', 'MA'];

      // --- Site owner config ---------------------------------------------
      // Edit these two values to set the page background. Not exposed to
      // site visitors — this is a code-level setting only.
      //
      // SITE_BACKGROUND_IMAGE_URL accepts either:
      //   - A path to a file you host yourself, e.g. '/static/beach.jpg'
      //     (put the file in a `static/` folder next to tidecharts.py —
      //     Flask serves anything in there automatically at that path).
      //   - A full external URL, e.g. 'https://example.com/beach.jpg'
      //     (must be a direct link to the image file itself, not a page
      //     that merely displays the image — see notes below).
      // Leave it as '' for no background image.
      const SITE_BACKGROUND_IMAGE_URL = '/static/background.jpeg';
      // 0 = fully invisible, 1 = fully opaque.
      const SITE_BACKGROUND_OPACITY = 0.3;

      function formatDate(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}${mm}${dd}`;
      }

      function formatDisplayDate(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }

      function formatPredictionTimeLocal(rawTime) {
        const parts = rawTime.split(' ');
        if (parts.length !== 2) return rawTime;
        const [, time] = parts;
        const [hour, minute] = time.split(':').map(value => parseInt(value, 10));
        if (isNaN(hour) || isNaN(minute)) return time;
        const d = new Date(2000, 0, 1, hour, minute);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function getLocalDateStringFromUTC(rawTime) {
        // NOAA hilo timestamps are already in local time (lst_ldt): 'YYYY-MM-DD HH:MM'
        // Just return the date portion directly.
        const parts = rawTime.split(' ');
        if (parts.length !== 2) return '';
        return parts[0];
      }

      function filterPredictionsByDate(predictions, dateString) {
        return predictions.filter(pred => getLocalDateStringFromUTC(pred.t) === dateString);
      }

      function loadFavorites() {
        try {
          const saved = localStorage.getItem('favoriteStations');
          favoriteStationIds = saved ? JSON.parse(saved) : [];
        } catch (err) {
          favoriteStationIds = [];
        }
      }

      function saveFavorites() {
        localStorage.setItem('favoriteStations', JSON.stringify(favoriteStationIds));
      }

      function sortStationIds(ids) {
        return ids.slice().sort((a, b) => {
          const aState = allStations[a].state;
          const bState = allStations[b].state;
          const aRank = topStates.indexOf(aState) === -1 ? topStates.length : topStates.indexOf(aState);
          const bRank = topStates.indexOf(bState) === -1 ? topStates.length : topStates.indexOf(bState);
          if (aRank !== bRank) return aRank - bRank;
          return allStations[a].name.localeCompare(allStations[b].name);
        });
      }

      function getFilteredStationIds(filter) {
        const normalized = filter.trim().toLowerCase();
        const ids = Object.keys(allStations).filter(id => {
          const station = allStations[id];
          const text = `${station.name} ${station.state}`.toLowerCase();
          return !normalized || text.includes(normalized);
        });
        return sortStationIds(ids);
      }

      function renderStationOptions() {
        stationSelect.innerHTML = '';
        const sortedIds = sortStationIds(Object.keys(allStations));
        sortedIds.forEach(id => {
          const option = document.createElement('option');
          option.value = id;
          option.textContent = `${allStations[id].name} (${allStations[id].state})`;
          stationSelect.appendChild(option);
        });
        if (selectedStation && allStations[selectedStation]) {
          stationSelect.value = selectedStation;
        }
      }

      function buildStationCard(id) {
        const station = allStations[id];
        const isFavorited = favoriteStationIds.includes(id);
        const card = document.createElement('div');
        card.className = 'station-card' + (selectedStation === id ? ' selected' : '');
        card.innerHTML = `
          <button type="button" class="favorite-button ${isFavorited ? 'favorited' : ''}" title="Toggle favorite">${isFavorited ? '★' : '☆'}</button>
          <h3>${station.name}</h3>
          <p>${station.state}</p>
          <p>ID: ${id}</p>
        `;

        card.addEventListener('click', event => {
          if (event.target.closest('button')) return;
          selectStation(id);
        });

        const button = card.querySelector('button');
        button.addEventListener('click', event => {
          event.stopPropagation();
          toggleFavorite(id);
        });

        return card;
      }

      function renderStationCards(filter = '') {
        stationCards.innerHTML = '';
        const stationIds = getFilteredStationIds(filter);
        const countNote = document.getElementById('stationCountNote');
        if (countNote) {
          countNote.textContent = `Showing ${stationIds.length} matching station${stationIds.length === 1 ? '' : 's'}.`;
        }

        stationIds.forEach(id => {
          stationCards.appendChild(buildStationCard(id));
        });
      }

      function renderFavorites() {
        favoritesSection.innerHTML = '';
        if (!favoriteStationIds.length) return;

        const container = document.createElement('div');
        container.className = 'station-section';
        container.innerHTML = '<div class="section-title"><h2>Favorite stations</h2><span class="small-note">Click a station to select it.</span></div>';
        const grid = document.createElement('div');
        grid.className = 'station-grid';

        favoriteStationIds.forEach(id => {
          if (!allStations[id]) return;
          grid.appendChild(buildStationCard(id));
        });

        container.appendChild(grid);
        favoritesSection.appendChild(container);
      }

      function selectStation(id) {
        if (!allStations[id]) return;
        selectedStation = id;
        stationSelect.value = id;
        renderStationCards(stationSearch.value);
        renderFavorites();
      }

      function toggleFavorite(id) {
        const idx = favoriteStationIds.indexOf(id);
        if (idx >= 0) {
          favoriteStationIds.splice(idx, 1);
        } else {
          favoriteStationIds.unshift(id);
        }
        favoriteStationIds = [...new Set(favoriteStationIds)].slice(0, 20);
        saveFavorites();
        renderStationCards(stationSearch.value);
        renderFavorites();
      }

      async function loadStations() {
        try {
          const response = await fetch('/api/stations');
          allStations = await response.json();
          loadFavorites();

          const sortedIds = sortStationIds(Object.keys(allStations));
          selectedStation = allStations[defaultStationId] ? defaultStationId : sortedIds[0];
          renderStationOptions();
          renderFavorites();
          renderStationCards();

          const today = new Date();
          dateInput.value = formatDisplayDate(today);
          stationSearch.value = '';
          stationSelect.value = selectedStation;
        } catch (e) {
          errorEl.textContent = 'Unable to load stations. Check the server console for errors.';
        }
      }

      function findHighLow(predictions) {
        let high = null;
        let low = null;
        predictions.forEach(prediction => {
          const value = parseFloat(prediction.v);
          if (isNaN(value)) return;
          if (!high || value > high.value) high = { ...prediction, value };
          if (!low || value < low.value) low = { ...prediction, value };
        });
        return { high, low };
      }

      function findDailyHighsLows(predictions) {
        // If the data already comes tagged as discrete hi/lo events (NOAA's
        // interval=hilo response includes a type of 'H' or 'L' per point),
        // trust it directly rather than guessing from neighboring points.
        if (predictions.length && predictions[0].type) {
          const highs = predictions
            .filter(p => p.type === 'H')
            .map(p => ({ ...p, value: parseFloat(p.v) }));
          const lows = predictions
            .filter(p => p.type === 'L')
            .map(p => ({ ...p, value: parseFloat(p.v) }));
          return { highs, lows };
        }

        // Fallback for dense, untagged curve data: detect local extrema.
        // Edge points are included (compared only to the neighbor that
        // exists) so the first/last tide event of the day isn't dropped.
        const highs = [];
        const lows = [];

        for (let i = 0; i < predictions.length; i++) {
          const curr = parseFloat(predictions[i].v);
          if (isNaN(curr)) continue;

          const prev = i > 0 ? parseFloat(predictions[i - 1].v) : null;
          const next = i < predictions.length - 1 ? parseFloat(predictions[i + 1].v) : null;
          if (prev !== null && isNaN(prev)) continue;
          if (next !== null && isNaN(next)) continue;

          const isHigh = (prev === null || curr > prev) && (next === null || curr > next);
          const isLow = (prev === null || curr < prev) && (next === null || curr < next);

          if (isHigh) highs.push({ ...predictions[i], value: curr });
          if (isLow) lows.push({ ...predictions[i], value: curr });
        }

        return { highs, lows };
      }

      function parsePredictionTime(t) {
        // t format: 'YYYY-MM-DD HH:MM' (already local time from NOAA's lst_ldt)
        const [datePart, timePart] = t.split(' ');
        const [y, m, d] = datePart.split('-').map(Number);
        const [hh, mm] = timePart.split(':').map(Number);
        return new Date(y, m - 1, d, hh, mm);
      }

      function cosineEase(v1, v2, fraction) {
        // Half-cosine easing: smooth S-curve from v1 to v2 as fraction goes 0 -> 1.
        // This approximates the real shape of a tide transitioning between a
        // high and a low, rather than a straight-line ramp.
        const eased = (1 - Math.cos(fraction * Math.PI)) / 2;
        return v1 * (1 - eased) + v2 * eased;
      }

      function buildSmoothCurve(predictions, samplesPerSegment = 24) {
        const points = predictions
          .map(p => ({ time: parsePredictionTime(p.t), value: parseFloat(p.v) }))
          .filter(p => !isNaN(p.value))
          .sort((a, b) => a.time - b.time);

        if (points.length < 2) return points;

        const curve = [];
        for (let i = 0; i < points.length - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const isLastSegment = i === points.length - 2;
          const steps = isLastSegment ? samplesPerSegment + 1 : samplesPerSegment;
          for (let s = 0; s < steps; s++) {
            const fraction = s / samplesPerSegment;
            const time = new Date(a.time.getTime() + fraction * (b.time.getTime() - a.time.getTime()));
            curve.push({ time, value: cosineEase(a.value, b.value, fraction) });
          }
        }
        return curve;
      }

      function isSameLocalDate(date, dateString) {
        const [y, m, d] = dateString.split('-').map(Number);
        return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
      }

      function createChart(predictions, units) {
        const chartId = 'tideChart';
        return `
          <div id="chartContainer">
            <h2>Tide waveform</h2>
            <canvas id="${chartId}" width="820" height="320"></canvas>
            <p class="small-note">Times are local. Line drawn from full tide predictions.</p>
          </div>
        `;
      }

      function drawTideChart(contextPredictions, dayPredictions, units, dateValue) {
        const canvas = document.getElementById('tideChart');
        if (!canvas || !canvas.getContext) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const padding = 40;

        // Build the smooth curve using the full fetched range (which includes
        // a day of padding on either side from the server) so the curve isn't
        // artificially flat right at midnight, then clip to the selected day.
        const fullCurve = buildSmoothCurve(contextPredictions);
        let dayCurve = fullCurve.filter(pt => isSameLocalDate(pt.time, dateValue));

        // Fallback if, for some reason, no context was available.
        if (!dayCurve.length) {
          dayCurve = dayPredictions
            .map(p => ({ time: parsePredictionTime(p.t), value: parseFloat(p.v) }))
            .filter(p => !isNaN(p.value));
        }

        const dayStart = (() => {
          const [y, m, d] = dateValue.split('-').map(Number);
          return new Date(y, m - 1, d, 0, 0, 0);
        })();
        const dayLengthMs = 24 * 60 * 60 * 1000;

        const values = dayCurve.map(pt => pt.value);
        const minValue = Math.min(...values);
        const maxValue = Math.max(...values);
        const range = maxValue - minValue || 1;

        const xForTime = time => padding + ((time.getTime() - dayStart.getTime()) / dayLengthMs) * (width - padding * 2);
        const yForValue = value => height - padding - ((value - minValue) / range) * (height - padding * 2);

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        // Smooth filled area under the curve for a "water level" feel.
        ctx.beginPath();
        dayCurve.forEach((pt, i) => {
          const x = xForTime(pt.time);
          const y = yForValue(pt.value);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.lineTo(xForTime(dayCurve[dayCurve.length - 1].time), height - padding);
        ctx.lineTo(xForTime(dayCurve[0].time), height - padding);
        ctx.closePath();
        ctx.fillStyle = 'rgba(17, 97, 209, 0.08)';
        ctx.fill();

        // The smooth tide curve itself.
        ctx.strokeStyle = '#1161d1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        dayCurve.forEach((pt, i) => {
          const x = xForTime(pt.time);
          const y = yForValue(pt.value);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Markers only at the actual high/low tide events for this day.
        const { highs, lows } = findDailyHighsLows(dayPredictions);
        ctx.fillStyle = '#1161d1';
        [...highs, ...lows].forEach(tide => {
          const time = parsePredictionTime(tide.t);
          const x = xForTime(time);
          const y = yForValue(parseFloat(tide.v));
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();
        });

        // Time-of-day axis labels, every 3 hours.
        ctx.fillStyle = '#4a5568';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        for (let hour = 0; hour <= 24; hour += 3) {
          const labelTime = new Date(dayStart.getTime() + hour * 60 * 60 * 1000);
          const x = xForTime(labelTime);
          const label = hour === 24 ? '24:00' : labelTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          ctx.fillText(label, x, height - padding + 20);
        }

        ctx.textAlign = 'right';
        ctx.fillText(`${minValue.toFixed(2)} ${units === 'metric' ? 'm' : 'ft'}`, width - 8, height - padding + 2);
        ctx.fillText(`${maxValue.toFixed(2)} ${units === 'metric' ? 'm' : 'ft'}`, width - 8, padding - 8);
      }

      function renderPredictions(station, predictions, allPredictions, units, dateValue) {
        if (!predictions || predictions.length === 0) {
          resultsEl.innerHTML = '<p>No tide data was returned for this selection.</p>';
          return;
        }

        const { highs, lows } = findDailyHighsLows(predictions);
        const unitLabel = units === 'metric' ? 'm' : 'ft';

        const allTides = [
          ...highs.map(h => ({ ...h, type: 'High tide' })),
          ...lows.map(l => ({ ...l, type: 'Low tide' })),
        ].sort((a, b) => a.t.localeCompare(b.t));

        const tideRows = allTides.map(tide => `
          <tr>
            <td>${tide.type}</td>
            <td>${formatPredictionTimeLocal(tide.t)}</td>
            <td>${parseFloat(tide.v).toFixed(2)}</td>
          </tr>
        `).join('');

        let summaryHtml = `
          <div>
            <h2>Today&apos;s high/low tides</h2>
            <table class="summary-table">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Time (local)</th>
                  <th>Height (${unitLabel})</th>
                </tr>
              </thead>
              <tbody>
                ${tideRows || '<tr><td colspan="3">No high/low tides found for this date.</td></tr>'}
              </tbody>
            </table>
          </div>
        `;

        resultsEl.innerHTML = summaryHtml + createChart(predictions, units);
        drawTideChart(allPredictions, predictions, units, dateValue);
      }

      async function loadTides() {
        errorEl.textContent = '';
        resultsEl.innerHTML = '';
        infoEl.textContent = '';

        const station = stationSelect.value || selectedStation;
        const dateValue = dateInput.value;
        const units = unitsSelect.value;

        if (!station || !dateValue) {
          errorEl.textContent = 'Please select a station and date.';
          return;
        }

        const beginDate = dateValue.replace(/-/g, '');
        const endDate = beginDate;
        const url = `/api/tides?station=`+encodeURIComponent(station)+`&begin_date=${beginDate}&end_date=${endDate}&units=`+encodeURIComponent(units);
        //const url = `/api/tides?date=today&station=${encodeURIComponent(station)}&product=predictions&datum=MLLW&time_zone=lst_ldt&interval=hilo&units=english&format=json`;
        try {
          loadButton.disabled = true;
          loadButton.textContent = 'Loading...';
          const response = await fetch(url);
          const data = await response.json();

          if (!response.ok) {
            errorEl.textContent = data.error || 'Failed to load tide data.';
            return;
          }

          const filteredPredictions = filterPredictionsByDate(data.predictions, dateValue);
          if (!filteredPredictions.length) {
            errorEl.textContent = 'No tide data was returned for the selected local date.';
            return;
          }

          const stationName = data.station?.name || 'Selected station';
          infoEl.textContent = `Showing tide predictions for ${stationName} on ${dateValue}.`;
          renderPredictions(data.station, filteredPredictions, data.predictions, units, dateValue);
        } catch (err) {
          errorEl.textContent = 'Network error while loading tide data.';
        } finally {
          loadButton.disabled = false;
          loadButton.textContent = 'Load Tides';
        }
      }

      function applyBackground() {
        bgLayer.style.backgroundImage = SITE_BACKGROUND_IMAGE_URL ? `url("${SITE_BACKGROUND_IMAGE_URL}")` : 'none';
        bgLayer.style.opacity = SITE_BACKGROUND_IMAGE_URL ? SITE_BACKGROUND_OPACITY : 0;
      }
      applyBackground();

      stationSearch.addEventListener('input', () => renderStationCards(stationSearch.value));
      stationSelect.addEventListener('change', () => {
        selectedStation = stationSelect.value;
        renderStationCards(stationSearch.value);
        renderFavorites();
      });
      loadButton.addEventListener('click', loadTides);
      window.addEventListener('load', loadStations);
    </script>
  </body>
</html>
